
name: Atualizar estatisticas GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar pasta
        run: mkdir -p profile

      - name: Gerar estatisticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Rubens1&show_icons=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Rubens1&hide_progress=true&hide=css,less,scss,html&theme=dark&card_width=320
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Atualizar estatisticas" || exit 0
          git push
