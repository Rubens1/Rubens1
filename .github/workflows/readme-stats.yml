name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Readme Stats SVG
        uses: anuraghazra/github-readme-stats@master
        with:
          TOKEN: ${{ secrets.GH_PAT }}
          # Definir o tema dos cards (ex: dark, dracula, tokyonight, synthwave)
          THEME: "dark"
          # Ocultar linguagens específicas (separadas por vírgula, em minúsculas)
          HIDE: "css,html,less,scss"
          # Ocultar barras de progresso de linguagens (opcional: true/false)
          HIDE_PROGRESS: "true"
          # Incluir todos os commits do histórico
          INCLUDE_ALL_COMMIT: "true"

      - name: Commit and Push SVGs to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update readme stats SVGs with custom theme"
          file_pattern: "*.svg"
