name: Generate Readme Stats

on:
  schedule:
    - cron: "0 0 * * *" # Atualiza diariamente à meia-noite
  workflow_dispatch: # Permite executar manualmente a qualquer momento

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: anuraghazra/github-readme-stats-actions@v1.0.0
        with:
          token: ${{ secrets.GH_PAT }}
          output-folder: "generated-stats"
          show_icons: "true"
          theme: "dark"
          hide_langs: "css,html,less,scss"

      - name: Commit and Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update readme stats SVGs"
